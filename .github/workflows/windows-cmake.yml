name: AXE Voice Windows CI
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build-and-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build and test with project script
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/build-windows.ps1
      - name: Verify quality gates (unit, blackbox, integration)
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/test-quality-gates.ps1
      - name: Package Windows laboratory ZIP
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/package-windows-lab.ps1
      - name: Verify laboratory package integrity
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/test-package-windows-lab.ps1
      - name: Publish laboratory ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AXE-Voice-Windows-Lab-Package
          path: dist/AXE-Voice-Windows-Lab-v*.zip
          if-no-files-found: error
      - name: Publish executable
        uses: actions/upload-artifact@v4
        with:
          name: AXE-Voice-Windows-Release
          path: |
            build/Release/AXE-Voice.exe
            build/Release/AXE-Voice-LAB.sha256
            build/Release/verify-axe-voice-lab.ps1
          if-no-files-found: error
