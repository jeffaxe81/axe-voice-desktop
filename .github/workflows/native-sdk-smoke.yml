name: AXE Voice native SDK smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-sdk-smoke.yml'
      - 'tests/run_1000_native_sip_connections.py'
      - 'tests/run_native_sip_loopback.py'
      - 'src/baresip_sip_engine.cpp'
      - 'src/native_account_config.h'
      - 'src/main.cpp'
      - 'src/sip_engine.h'
      - 'src/account_form_feedback.h'
      - 'tests/native_sip_engine_smoke.cpp'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/native-sdk-smoke.yml'
      - 'scripts/build-native-sdk-smoke.ps1'
      - 'scripts/package-native-candidate.ps1'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'src/**'
      - 'installer/**'
      - 'tests/run_native_sip_loopback.py'
      - 'tests/native_*'
      - 'tests/test_native_package_gates.ps1'
      - 'tests/test_security_*'
      - 'tests/test_audio_device_change*'
      - 'tests/test_audio_endpoint_watcher.cpp'
      - 'tests/audio_watcher_fakes/**'
      - 'tests/test_incoming_*'
      - 'tests/test_tone_cancellation.cpp'
      - 'tests/test_native_*'
      - 'tests/native_libre_reactor_smoke.cpp'
      - 'tests/baresip_sdk_abi_probe.cpp'
      - 'tests/native_tls_media_probe.cpp'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  msvc-native-sdk:
    runs-on: windows-2022
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        profile: [abi, tls-media]
    steps:
      - uses: actions/checkout@v4
      - name: Reject syntax errors in release PowerShell before the SDK build
        shell: pwsh
        run: |
          $Scripts = @(
            'scripts/package-native-candidate.ps1',
            'tests/test_native_postinstall_launch.ps1',
            'tests/test_native_desktop_shortcut.ps1',
            'scripts/capture-windows-design.ps1'
          )
          foreach ($File in $Scripts) {
            $Tokens = $null
            $Errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $File).Path,
              [ref]$Tokens, [ref]$Errors
            )
            if (@($Errors).Count -gt 0) {
              throw "PowerShell parsing failed: $File ($(@($Errors).Count) issue(s))"
            }
            Write-Host "Parse PASS: $File"
          }
      - uses: actions/cache/restore@v4
        id: sdk-cache
        with:
          path: |
            build/native-sdk-deps-${{ matrix.profile }}/
            build/native-sdk-${{ matrix.profile }}/prefix/
          key: msvc2022-sdk-v1-${{ matrix.profile }}-re65555da-bs9cfab81-ssl8cf17aa
      - name: Verify literal package file integrity
        shell: pwsh
        run: |
          ./tests/test_security_package.ps1
          ./tests/test_security_package_paths.ps1
          ./tests/test_security_manifest_types.ps1
          ./tests/test_security_manifest_paths.ps1
          ./tests/test_security_manifest_generation.ps1
          ./tests/test_security_manifest_names.ps1
      - name: Verify local TLS fixture handshake deadline
        run: python tests/test_native_tls_fixture.py
      - name: Build pinned MSVC candidate and run real libre reactor
        shell: pwsh
        run: |
          if ('${{ matrix.profile }}' -eq 'tls-media') {
            ./scripts/build-native-sdk-smoke.ps1 -TlsMedia
          } else {
            ./scripts/build-native-sdk-smoke.ps1
          }
      - name: Execute 1000 native Baresip SIP loopback connection tests
        if: matrix.profile == 'tls-media'
        shell: pwsh
        run: |
          $Exe = Join-Path $PWD 'build/native-sdk-tls-media/product/Release/axv_native_sip_engine_smoke.exe'
          python tests/run_1000_native_sip_connections.py $Exe --count 1000 --workers 12 --report build/native-sip-1000.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish evidence for 1000 SIP connection tests
        if: always() && matrix.profile == 'tls-media'
        uses: actions/upload-artifact@v4
        with:
          name: AXE-Voice-Native-SIP-1000-Results
          path: build/native-sip-1000.json
          if-no-files-found: warn
          retention-days: 14
      - name: Reject mismatched candidate package inputs
        if: matrix.profile == 'tls-media'
        shell: pwsh
        run: ./tests/test_native_package_gates.ps1
      - name: Build and verify candidate installer
        if: matrix.profile == 'tls-media'
        shell: pwsh
        run: |
          $Stage = 'build/native-candidate-stage'
          New-Item -ItemType Directory -Force $Stage | Out-Null
          $Stale = Join-Path $Stage 'axe-stale-fixture.dll'
          Set-Content $Stale 'stale fixture'
          ./scripts/package-native-candidate.ps1
          if (Test-Path $Stale) { throw 'Stale staging DLL survived packaging' }
      - uses: actions/setup-dotnet@v4
        if: matrix.profile == 'tls-media'
        with:
          dotnet-version: '10.0.x'
      - name: Package WinUI 3 with actual native SIP host (laboratory only)
        if: matrix.profile == 'tls-media'
        shell: pwsh
        run: |
          $Out = 'build/winui3-native-candidate'
          dotnet publish apps/winui3/AXEVoice.WinUI3.csproj -c Release -r win-x64 -p:Platform=x64 -p:SelfContained=false -o $Out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $Native = 'build/native-sdk-tls-media/product/Release/axv_frontend_bridge.dll'
          if (!(Test-Path $Native)) { throw 'Native Baresip bridge missing' }
          Copy-Item $Native $Out -Force
          Get-ChildItem 'build/native-sdk-tls-media/prefix/bin' -Filter '*.dll' |
            Copy-Item -Destination $Out -Force
          New-Item -ItemType Directory -Force (Join-Path $Out 'licenses') | Out-Null
          Copy-Item 'build/native-sdk-tls-media/prefix/licenses/*' (Join-Path $Out 'licenses') -Force
          if (!(Test-Path (Join-Path $Out 'AXEVoice.WinUI3.exe'))) { throw 'WinUI 3 exe missing' }
          if (!(Test-Path (Join-Path $Out 'axv_frontend_bridge.dll'))) { throw 'Native bridge missing' }
          @(
            'AXE VOICE WINUI 3 -- CANDIDATO NATIVO DE LABORATORIO',
            'Nao homologado; sem assinatura; nao aprovado para producao.',
            'Acoes SIP so sao liberadas apos clicar CONECTAR, utilizar conta previamente',
            'salva no Windows pelo AXE Voice Win32 e obter confirmacao nativa do registro.',
            'Transporte UDP/TLS explicito; TLS requer CA. Sem downgrades.',
            'Requer Windows App Runtime 2.6.5 e .NET 10 desktop runtime compativeis.',
            'Testes com central real e audio bidirecional ainda pendentes.'
          ) | Set-Content -Encoding UTF8 (Join-Path $Out 'LEIA-ME-CANDIDATO.txt')
      - name: Publish optional WinUI 3 native SIP candidate
        if: matrix.profile == 'tls-media'
        uses: actions/upload-artifact@v4
        with:
          name: AXE-Voice-WinUI3-Native-SIP-Lab-Candidate
          path: build/winui3-native-candidate/
          if-no-files-found: error
          retention-days: 14
      - name: Publish candidate installer
        if: matrix.profile == 'tls-media'
        uses: actions/upload-artifact@v4
        with:
          name: AXE-Voice-Native-Candidate-Setup
          path: build/native-candidate-installer/*.exe
          if-no-files-found: error
      - name: Publish candidate SDK with provenance and licenses
        uses: actions/upload-artifact@v4
        with:
          name: AXE-native-SDK-MSvc-${{ matrix.profile }}
          path: build/native-sdk-${{ matrix.profile }}/prefix/
          if-no-files-found: error
      - name: Publish build-only ABI and reactor binaries
        uses: actions/upload-artifact@v4
        with:
          name: AXE-native-SDK-probes-${{ matrix.profile }}
          path: build/native-sdk-${{ matrix.profile }}/product/Release/
          if-no-files-found: error
      - name: Cache pinned source builds, including interrupted builds
        if: always() && steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/native-sdk-deps-${{ matrix.profile }}/
            build/native-sdk-${{ matrix.profile }}/prefix/
          key: msvc2022-sdk-v1-${{ matrix.profile }}-re65555da-bs9cfab81-ssl8cf17aa
