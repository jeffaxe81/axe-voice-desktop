name: Codec audit tooling
on:
  push:
    paths:
      - 'tools/codec_audit.py'
      - 'tests/test_codec_audit.py'
      - '.github/workflows/codec-audit.yml'
  pull_request:
    paths:
      - 'tools/codec_audit.py'
      - 'tests/test_codec_audit.py'
      - '.github/workflows/codec-audit.yml'
permissions:
  contents: read
jobs:
  audit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile script
        run: python -m py_compile tools/codec_audit.py
      - name: Run synthetic artifact tests
        run: python -m unittest discover -s tests -p test_codec_audit.py -v
